[package]
name = "zvucast"
version = "0.1.15"
edition.workspace = true
license.workspace = true

[dependencies]
zproto = { path = "../zproto" }
zsync = { path = "../zsync" }
gstreamer = { version = "0.23", package = "gstreamer" }
gstreamer-app = "0.23"
gstreamer-base = { version = "0.23", features = ["v1_18"] }
gio = "0.20"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
sendspin = "=0.3.8"
mdns-sd = "0.20"
# PipeWire-хост cpal только на передатчиках: PC (x86_64) и Pi 4 (aarch64).
# arm (Orange Pi): в sysroot нет заголовков PipeWire, libspa-sys не собирается.
cpal = "0.18"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }

[dev-dependencies]
gstreamer-app = "0.23"
