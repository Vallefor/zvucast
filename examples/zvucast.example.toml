# Sample of /etc/zvucast.toml, the file install.sh writes on first install.
# A later install leaves an existing file alone.
# The agent prepends id = "<uuid>" the first time it starts.
# Capture and playback devices are chosen in the web panel.

name = "living-room"
controller = "ws://127.0.0.1:8080/ws"
playback_backend = "pipewire"
sync_interface = "eth0"

[pipeline]
jb_ms = 2
rx_buffer_us = 5000
rx_latency_us = 1000
tx_buffer_us = 10000
tx_latency_us = 2500
mcast_group = "239.0.0.1"
port = 5004
